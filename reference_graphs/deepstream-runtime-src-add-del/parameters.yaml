components:
- name: streammux
  parameters:
    batch-size: 4
    batched-push-timeout: 32000
    height: 1080
    live-source: true
    width: 1920
name: streammux
---
components:
- name: object_detector
  parameters:
    batch-size: 4
- name: resnet18_4_class_detector
  parameters:
    model-engine-file: primary.resnet18_trafficcamnet_pruned.onnx_b4_gpu0_int8.engine
name: object_detector
---
components:
- name: tracker
  parameters:
    ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
    ll-config-file: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml
    tracker-height: 384
    tracker-width: 640
name: tracker
---
components:
- name: vehicle_make_classifier
  parameters:
    batch-size: 16
    unique-id: 3
- name: secondary_vehicle_make_classifier
  parameters:
    model-engine-file: sec.resnet18_vehiclemakenet_pruned.onnx_b16_gpu0_int8.engine
name: vehicle_make_classifier
---
components:
- name: vehicle_type_classifier
  parameters:
    batch-size: 16
    unique-id: 4
- name: secondary_vehicle_type_classifier
  parameters:
    model-engine-file: sec.resnet18_vehicletypenet_pruned.onnx_b16_gpu0_int8.engine
name: vehicle_type_classifier
---
components:
- name: sample_runtime_source_manipulator
  parameters:
    interval-sec: 10
    max-num-sources: 4
    uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h265.mp4
name: sample_runtime_source_manipulator
